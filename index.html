<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چت پرو</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        * { box-sizing: border-box; font-family: Vazirmatn, Tahoma; }
        body { background: #000; color: #fff; margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .box { background: #111; border: 1px solid #333; border-radius: 15px; padding: 20px; width: 90%; max-width: 400px; }
        input, button { width: 100%; padding: 12px; margin: 6px 0; border-radius: 8px; border: 1px solid #333; background: #222; color: #fff; font-family: Vazirmatn; outline: none; }
        button { background: #6366f1; border: none; font-weight: bold; cursor: pointer; }
        .chat-box { height: 300px; overflow-y: auto; background: #000; border: 1px solid #333; border-radius: 10px; padding: 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: #222; padding: 10px; border-radius: 10px; font-size: 14px; width: fit-content; max-width: 80%; }
        .msg.mine { background: #6366f1; align-self: flex-end; }
    </style>
</head>
<body>

    <div id="auth" class="box">
        <h2 style="text-align:center; color:#818cf8; margin-bottom:15px;">چت پرو</h2>
        <input type="text" id="name" placeholder="نام شما">
        <input type="text" id="user" placeholder="نام کاربری (انگلیسی)">
        <input type="password" id="pass" placeholder="رمز عبور">
        <input type="text" id="code" placeholder="کد دمو (12345)">
        <button onclick="login()">ورود / ثبت‌نام</button>
    </div>

    <div id="chat-screen" class="box" style="display:none;">
        <h3 id="welcome" style="text-align:center; margin-bottom:15px;"></h3>
        <div id="chat-box" class="chat-box"></div>
        <input type="text" id="msg" placeholder="پیام..." onkeypress="if(event.key==='Enter') sendMsg()">
        <button onclick="sendMsg()">ارسال</button>
        <button onclick="logout()" style="background:#ef4444; margin-top:10px;">خروج</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCpksdl0L0z81tNJBMj_PjOQMS-kcn_Ceg",
            authDomain: "chat-pro-ff65d.firebaseapp.com",
            projectId: "chat-pro-ff65d",
            storageBucket: "chat-pro-ff65d.firebasestorage.app",
            messagingSenderId: "804620446100",
            appId: "1:804620446100:web:776a714048fb732b93c781"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let me = null;

        window.login = async function() {
            const name = document.getElementById('name').value;
            const user = document.getElementById('user').value;
            const pass = document.getElementById('pass').value;
            const code = document.getElementById('code').value;

            if (code !== '12345') return alert('کد دمو اشتباهه!');
            if (!name || !user || !pass) return alert('همه فیلدها الزامی است!');

            await addDoc(collection(db, "users"), { name, user, pass });
            me = { name, user };
            
            document.getElementById('auth').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'block';
            document.getElementById('welcome').innerText = 'خوش آمدی ' + name;
            
            loadChat();
        }

        function loadChat() {
            const q = query(collection(db, "messages"), orderBy("time", "asc"));
            onSnapshot(q, (snap) => {
                let html = '';
                snap.forEach(d => {
                    let m = d.data();
                    let isMine = m.name === me.name;
                    html += `<div class="msg ${isMine ? 'mine' : ''}"><b>${m.name}:</b> ${m.text}</div>`;
                });
                const box = document.getElementById('chat-box');
                box.innerHTML = html;
                box.scrollTop = box.scrollHeight;
            });
        }

        window.sendMsg = async function() {
            const text = document.getElementById('msg').value;
            if(!text) return;
            document.getElementById('msg').value = '';
            await addDoc(collection(db, "messages"), { name: me.name, text: text, time: Date.now() });
        }

        window.logout = function() { location.reload(); }
    </script>
</body>
</html>
