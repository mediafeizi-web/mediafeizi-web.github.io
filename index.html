<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تست ثبت نام</title>
</head>
<body style="background:#000; color:#fff; padding:20px; text-align:center; font-family:Tahoma;">
    <h2>تست ثبت‌نام چت پرو</h2>
    <input type="text" id="test-name" placeholder="یه اسم بنویس" style="padding:10px; margin:10px;"><br>
    <button onclick="testRegister()" style="padding:10px 20px; background:blue; color:white; border:none; border-radius:5px; cursor:pointer;">تست ثبت‌نام</button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCpksdl0L0z81tNJBMj_PjOQMS-kcn_Ceg",
            authDomain: "chat-pro-ff65d.firebaseapp.com",
            projectId: "chat-pro-ff65d",
            storageBucket: "chat-pro-ff65d.firebasestorage.app",
            messagingSenderId: "804620446100",
            appId: "1:804620446100:web:776a714048fb732b93c781"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.testRegister = async function() {
            const name = document.getElementById('test-name').value;
            if(!name) return alert('اسم رو بنویس!');
            alert('دکمه کار کرد! در حال اتصال به فایربیس...');
            try {
                await addDoc(collection(db, "users"), { name: name, test: true });
                alert('عالیه! دیتابیس جواب داد و ذخیره شد.');
            } catch (error) {
                alert('ارور فایربیس: ' + error.message);
            }
        }
    </script>
</body>
</html>
