<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چت پرو</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="pb-16">

    <!-- صفحه ورود -->
    <div id="auth-screen" class="fixed inset-0 bg-slate-900 flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 p-8 rounded-3xl w-full max-w-sm shadow-2xl">
            <div class="text-center mb-6">
                <h1 class="text-3xl font-bold text-blue-500 mb-2">چت پرو 💬</h1>
                <p class="text-gray-400 text-sm">شماره موبایل خود را وارد کنید</p>
            </div>
            <div id="phone-step">
                <input type="tel" id="phone" placeholder="09123456789" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-center mb-4 text-lg outline-none focus:border-blue-500" dir="ltr">
                <button onclick="sendOtp()" id="btn-send-otp" class="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded-xl font-bold transition-all">دریافت کد</button>
            </div>
            <div id="otp-step" class="hidden">
                <input type="text" id="otp" placeholder="کد ۶ رقمی" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-center mb-4 text-lg tracking-widest outline-none focus:border-blue-500" dir="ltr" maxlength="6">
                <button onclick="verifyOtp()" id="btn-verify-otp" class="w-full bg-green-600 hover:bg-green-700 p-3 rounded-xl font-bold transition-all">تایید و ورود</button>
            </div>
            <p id="auth-msg" class="text-center text-red-400 mt-4 text-sm"></p>
        </div>
    </div>

    <!-- تنظیم پروفایل -->
    <div id="setup-screen" class="hidden fixed inset-0 bg-slate-900 flex items-center justify-center p-4 z-40">
        <div class="bg-slate-800 p-8 rounded-3xl w-full max-w-sm shadow-2xl">
            <h2 class="text-xl font-bold mb-4 text-center text-blue-400">تکمیل پروفایل</h2>
            <input type="text" id="setup-name" placeholder="نام شما (مثلا: علی)" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 mb-3 outline-none focus:border-blue-500">
            <input type="text" id="setup-username" placeholder="نام کاربری (انگلیسی)" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 mb-3 outline-none focus:border-blue-500" dir="ltr">
            <input type="text" id="setup-avatar" placeholder="لینک عکس پروفایل (اختیاری)" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 mb-3 outline-none focus:border-blue-500" dir="ltr">
            <button onclick="saveProfile()" class="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded-xl font-bold transition-all">ذخیره و ورود به چت</button>
        </div>
    </div>

    <!-- برنامه اصلی -->
    <div id="main-app" class="hidden">
        <header class="bg-slate-800 p-4 sticky top-0 z-10 flex justify-between items-center shadow-md">
            <h1 id="header-title" class="font-bold text-lg">چت عمومی 🌍</h1>
            <button onclick="logout()" class="text-red-400 text-sm hover:text-red-300">خروج</button>
        </header>

        <main class="p-4">
            <div id="tab-chat">
                <div id="chat-box" class="chat-container bg-slate-800/50 rounded-2xl p-4 mb-4 flex flex-col gap-3"></div>
                <div class="flex gap-2 fixed bottom-16 left-4 right-4 bg-slate-800 p-2 rounded-2xl shadow-lg border border-slate-700">
                    <input type="text" id="msg-input" placeholder="پیام خود را بنویسید..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl p-3 outline-none focus:border-blue-500 text-sm" onkeypress="if(event.key === 'Enter') sendMessage()">
                    <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-700 px-6 rounded-xl font-bold transition-all text-sm">ارسال</button>
                </div>
            </div>

            <div id="tab-users" class="hidden">
                <h2 class="text-gray-400 mb-3 text-sm">لیست کاربران (برای چت خصوصی کلیک کنید)</h2>
                <div id="users-list" class="flex flex-col gap-2"></div>
            </div>

            <div id="tab-profile" class="hidden">
                <div class="bg-slate-800 p-6 rounded-3xl text-center relative border border-slate-700 shadow-lg">
                    <img id="prof-avatar" src="https://ui-avatars.com/api/?name=User&background=random" class="w-24 h-24 rounded-full mx-auto border-4 border-slate-600 mb-3 object-cover">
                    <h2 id="prof-name" class="text-xl font-bold flex justify-center items-center"></h2>
                    <p id="prof-username" class="text-gray-400 mb-3 text-sm" dir="ltr"></p>
                    
                    <div class="text-right mt-4 bg-slate-900 p-4 rounded-xl">
                        <label class="text-sm text-gray-400">بیوگرافی:</label>
                        <textarea id="prof-bio" class="w-full bg-transparent border-b border-slate-700 mt-2 outline-none resize-none text-sm" rows="2"></textarea>
                    </div>
                    <button onclick="updateProfile()" class="mt-4 w-full bg-green-600 hover:bg-green-700 p-3 rounded-xl font-bold transition-all">به‌روزرسانی پروفایل</button>
                </div>
            </div>
        </main>

        <nav class="fixed bottom-0 left-0 right-0 bg-slate-800 flex justify-around p-3 border-t border-slate-700 z-20">
            <button onclick="switchTab('chat')" id="nav-chat" class="text-blue-500 flex flex-col items-center w-1/3">
                <span class="text-xl">💬</span><span class="text-xs mt-1 font-bold">چت</span>
            </button>
            <button onclick="switchTab('users')" id="nav-users" class="text-gray-400 hover:text-white flex flex-col items-center w-1/3">
                <span class="text-xl">👥</span><span class="text-xs mt-1 font-bold">کاربران</span>
            </button>
            <button onclick="switchTab('profile')" id="nav-profile" class="text-gray-400 hover:text-white flex flex-col items-center w-1/3">
                <span class="text-xl">👤</span><span class="text-xs mt-1 font-bold">پروفایل</span>
            </button>
        </nav>
    </div>

    <script src="app.js"></script>
    <script src="chat.js"></script>
</body>
</html>
