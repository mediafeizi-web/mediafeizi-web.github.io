<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چت پرو</title>
    <style>
        * { box-sizing: border-box; font-family: Tahoma; }
        body { background: #000; color: #fff; margin: 0; height: 100vh; display: flex; flex-direction: column; }
        .hidden { display: none !important; }
        .box { background: #111; padding: 15px; border-radius: 10px; margin: 15px; border: 1px solid #333; }
        input, button { width: 100%; padding: 12px; margin: 6px 0; border-radius: 8px; border: 1px solid #333; background: #222; color: #fff; }
        button { background: #4f46e5; border: none; font-weight: bold; cursor: pointer; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: #111; border-bottom: 1px solid #333; }
        .content { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 80px; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #111; border-top: 1px solid #333; display: flex; justify-content: space-around; padding: 10px; z-index: 10; }
        .bottom-nav button { width: auto; background: none; font-size: 24px; padding: 5px; margin: 0; border: none; }
        .msg { margin-bottom: 10px; padding: 10px; border-radius: 8px; background: #222; display: flex; gap: 10px; max-width: 85%; }
        .msg.mine { background: #4f46e5; margin-right: auto; }
        .msg.other { margin-left: auto; }
        .msg img.avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }
        .msg img.chat-img { max-width: 100%; border-radius: 8px; margin-top: 5px; }
        .user-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-bottom: 1px solid #333; cursor: pointer; }
        .user-item img { width: 40px; height: 40px; border-radius: 50%; }
        .input-area { position: fixed; bottom: 60px; left: 0; right: 0; background: #000; padding: 10px; display: flex; gap: 5px; border-top: 1px solid #333; }
        .input-area input { margin: 0; flex: 1; }
        .input-area button { width: auto; margin: 0; padding: 10px; }
        .emoji-picker { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; padding: 10px; background: #222; border-radius: 8px; position: fixed; bottom: 110px; left: 10px; right: 10px; }
        .emoji-picker span { font-size: 24px; cursor: pointer; text-align: center; }
        .admin-btn { background: #ef4444; width: auto; padding: 5px 10px; font-size: 12px; margin: 0; }
        .admin-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #333; }
        .admin-row button { width: auto; padding: 5px 10px; font-size: 12px; margin: 0 2px; }
    </style>
</head>
<body>

    <!-- صفحه ورود -->
    <div id="auth-screen" class="box" style="margin-top:50px;">
        <h2 style="text-align:center; color: #818cf8;">چت پرو</h2>
        <input type="text" id="name" placeholder="نام شما">
        <input type="text" id="user" placeholder="نام کاربری (انگلیسی)">
        <input type="password" id="pass" placeholder="رمز عبور">
        <input type="text" id="code" placeholder="کد دمو (12345)">
        <button onclick="login()">ورود / ثبت‌نام</button>
    </div>

    <!-- هدر اصلی -->
    <div id="main-header" class="header hidden">
        <div style="display:flex; align-items:center; gap:10px;">
            <img id="my-avatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" style="width:35px; height:35px; border-radius:50%;">
            <span id="welcome" style="font-weight:bold;"></span>
        </div>
        <button class="admin-btn" onclick="switchTab('admin')">مدیریت</button>
    </div>

    <!-- محتوای اصلی -->
    <div id="content-area" class="content hidden">
        <!-- چت عمومی -->
        <div id="tab-public" class="tab-content">
            <div id="public-msgs"></div>
        </div>
        
        <!-- چت خصوصی -->
        <div id="tab-private" class="tab-content hidden">
            <div id="private-list"></div>
            <div id="private-chat" class="hidden">
                <button onclick="backToPrivateList()" style="background:#333; margin-bottom:10px;">بازگشت</button>
                <div id="private-msgs"></div>
            </div>
        </div>

        <!-- پروفایل -->
        <div id="tab-profile" class="tab-content hidden">
            <div class="box">
                <h3 style="text-align:center;">پروفایل من</h3>
                <img id="prof-avatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" style="width:80px; height:80px; border-radius:50%; display:block; margin:auto;">
                <input type="file" id="avatar-file" accept="image/*" style="display:none;" onchange="uploadAvatar(event)">
                <button onclick="document.getElementById('avatar-file').click()" style="background:#333;">تغییر عکس</button>
                <label>نام:</label>
                <input type="text" id="prof-name">
                <label>بیوگرافی:</label>
                <input type="text" id="prof-bio">
                <button onclick="saveProfile()">ذخیره تغییرات</button>
            </div>
        </div>

        <!-- پنل مدیریت -->
        <div id="tab-admin" class="tab-content hidden">
            <div id="admin-list"></div>
        </div>
    </div>

    <!-- نوار پایین -->
    <div id="bottom-nav" class="bottom-nav hidden">
        <button onclick="switchTab('public')">🌐</button>
        <button onclick="switchTab('private')">💬</button>
        <button onclick="switchTab('profile')">👤</button>
    </div>

    <!-- نوار ارسال پیام -->
    <div id="chat-input" class="input-area hidden">
        <label for="chat-file" style="cursor:pointer; font-size:24px; padding:5px;">📎</label>
        <input type="file" id="chat-file" accept="image/*" style="display:none;" onchange="uploadChatImage(event)">
        <button onclick="toggleEmoji()" style="background:none; border:none; font-size:24px;">😀</button>
        <input type="text" id="msg" placeholder="پیام..." onkeypress="if(event.key==='Enter') sendMsg()">
        <button onclick="sendMsg()">ارسال</button>
    </div>
    <div id="emoji-picker" class="emoji-picker hidden">
        <span onclick="addEmoji('😀')">😀</span><span onclick="addEmoji('😂')">😂</span><span onclick="addEmoji('😍')">😍</span><span onclick="addEmoji('😎')">😎</span><span onclick="addEmoji('🤔')">🤔</span><span onclick="addEmoji('👍')">👍</span><span onclick="addEmoji('❤️')">❤️</span><span onclick="addEmoji('🔥')">🔥</span><span onclick="addEmoji('🎉')">🎉</span><span onclick="addEmoji('🙏')">🙏</span><span onclick="addEmoji('💯')">💯</span><span onclick="addEmoji('👋')">👋</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, updateDoc, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCpksdl0L0z81tNJBMj_PjOQMS-kcn_Ceg",
            authDomain: "chat-pro-ff65d.firebaseapp.com",
            projectId: "chat-pro-ff65d",
            storageBucket: "chat-pro-ff65d.firebasestorage.app",
            messagingSenderId: "804620446100",
            appId: "1:804620446100:web:776a714048fb732b93c781"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let me = null;
        let usersList = [];
        let allMsgs = [];
        let currentTab = 'public';
        let currentPrivateUserId = null;

        // ورود / ثبت نام
        window.login = async function() {
            const name = document.getElementById('name').value.trim();
            const user = document.getElementById('user').value.trim().toLowerCase();
            const pass = document.getElementById('pass').value;
            const code = document.getElementById('code').value;

            if (code !== '12345') return alert('کد دمو اشتباه است!');
            if (!name || !user || !pass) return alert('همه فیلدها الزامی است!');

            const q = query(collection(db, "users"), where("username", "==", user));
            const snap = await getDocs(q);

            if (!snap.empty) {
                let u = snap.docs[0].data();
                u.id = snap.docs[0].id;
                if (u.password !== pass) return alert('رمز عبور اشتباه است!');
                if (u.isBlocked) return alert('حساب شما مسدود شده است!');
                me = u;
            } else {
                const newUser = { name, username: user, password: pass, isVerified: false, isBlocked: false, avatar: '', bio: '' };
                const docRef = await addDoc(collection(db, "users"), newUser);
                newUser.id = docRef.id;
                me = newUser;
            }
            localStorage.setItem('cp_user', JSON.stringify(me));
            startChat();
        }

        window.logout = function() {
            localStorage.removeItem('cp_user');
            location.reload();
        }

        function startChat() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('main-header').classList.remove('hidden');
            document.getElementById('content-area').classList.remove('hidden');
            document.getElementById('bottom-nav').classList.remove('hidden');
            
            document.getElementById('welcome').innerText = me.name;
            if(me.avatar) document.getElementById('my-avatar').src = me.avatar;

            onSnapshot(collection(db, "users"), (snap) => {
                usersList = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                const myData = usersList.find(u => u.id === me.id);
                if (myData) {
                    if (myData.isBlocked) { alert('شما مسدود شدید!'); logout(); return; }
                    me = myData;
                    document.getElementById('welcome').innerText = me.name + (me.isVerified ? ' ✔️' : '');
                    if(me.avatar) { document.getElementById('my-avatar').src = me.avatar; document.getElementById('prof-avatar').src = me.avatar; }
                    if(currentTab === 'private') renderPrivateList();
                    if(currentTab === 'admin') renderAdmin();
                }
            });

            onSnapshot(query(collection(db, "messages"), orderBy("time", "asc")), (snap) => {
                allMsgs = snap.docs.map(d => d.data());
                if (currentTab === 'public') renderPublic();
                if (currentTab === 'private' && currentPrivateUserId) renderPrivateMsgs();
            });

            switchTab('public');
        }

        window.switchTab = function(tab) {
            currentTab = tab;
            currentPrivateUserId = null;
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('chat-input').classList.add('hidden');
            document.getElementById('emoji-picker').classList.add('hidden');

            if (tab === 'public') {
                document.getElementById('tab-public').classList.remove('hidden');
                document.getElementById('chat-input').classList.remove('hidden');
                renderPublic();
            } else if (tab === 'private') {
                document.getElementById('tab-private').classList.remove('hidden');
                document.getElementById('private-chat').classList.add('hidden');
                document.getElementById('private-list').classList.remove('hidden');
                renderPrivateList();
            } else if (tab === 'profile') {
                document.getElementById('tab-profile').classList.remove('hidden');
                document.getElementById('prof-name').value = me.name;
                document.getElementById('prof-bio').value = me.bio || '';
            } else if (tab === 'admin') {
                document.getElementById('tab-admin').classList.remove('hidden');
                renderAdmin();
            }
        }

        // رندر چت عمومی
        function renderPublic() {
            let html = '';
            allMsgs.filter(m => m.receiverId === 'public').forEach(m => {
                let sender = usersList.find(u => u.id === m.senderId) || { name: m.name, avatar: '' };
                let av = sender.avatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
                let tick = sender.isVerified ? ' ✔️' : '';
                let img = m.image ? `<img src="${m.image}" class="chat-img">` : '';
                html += `<div class="msg ${m.senderId === me.id ? 'mine' : 'other'}"><div><img src="${av}" class="avatar"><b>${m.name}${tick}:</b><br>${m.text}${img}</div></div>`;
            });
            document.getElementById('public-msgs').innerHTML = html;
            document.getElementById('content-area').scrollTop = document.getElementById('content-area').scrollHeight;
        }

        // لیست چت خصوصی
        function renderPrivateList() {
            let html = '';
            usersList.filter(u => u.id !== me.id && !u.isBlocked).forEach(u => {
                let av = u.avatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
                let tick = u.isVerified ? ' ✔️' : '';
                html += `<div class="user-item" onclick="openPrivateChat('${u.id}')"><img src="${av}"><div><b>${u.name}${tick}</b><br><small>@${u.username}</small></div></div>`;
            });
            document.getElementById('private-list').innerHTML = html;
        }

        window.openPrivateChat = function(id) {
            currentPrivateUserId = id;
            document.getElementById('private-list').classList.add('hidden');
            document.getElementById('private-chat').classList.remove('hidden');
            document.getElementById('chat-input').classList.remove('hidden');
            renderPrivateMsgs();
        }

        window.backToPrivateList = function() {
            currentPrivateUserId = null;
            document.getElementById('private-chat').classList.add('hidden');
            document.getElementById('private-list').classList.remove('hidden');
            document.getElementById('chat-input').classList.add('hidden');
        }

        // رندر پیام‌های خصوصی
        function renderPrivateMsgs() {
            let html = '';
            allMsgs.filter(m => (m.senderId === me.id && m.receiverId === currentPrivateUserId) || (m.senderId === currentPrivateUserId && m.receiverId === me.id)).forEach(m => {
                let sender = usersList.find(u => u.id === m.senderId) || { name: m.name, avatar: '' };
                let av = sender.avatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
                let tick = sender.isVerified ? ' ✔️' : '';
                let img = m.image ? `<img src="${m.image}" class="chat-img">` : '';
                html += `<div class="msg ${m.senderId === me.id ? 'mine' : 'other'}"><div><img src="${av}" class="avatar"><b>${m.name}${tick}:</b><br>${m.text}${img}</div></div>`;
            });
            document.getElementById('private-msgs').innerHTML = html;
            document.getElementById('content-area').scrollTop = document.getElementById('content-area').scrollHeight;
        }

        // ارسال پیام
        window.sendMsg = async function() {
            const input = document.getElementById('msg');
            if (!input.value.trim()) return;
            const text = input.value;
            input.value = '';
            await addDoc(collection(db, "messages"), { 
                senderId: me.id, 
                name: me.name, 
                receiverId: currentTab === 'public' ? 'public' : currentPrivateUserId,
                text: text, 
                time: Date.now() 
            });
        }

        // ارسال عکس در چت
        window.uploadChatImage = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = async function() {
                    const canvas = document.createElement('canvas');
                    const MAX = 600; let w = img.width, h = img.height;
                    if (w > h) { if (w > MAX) { h *= MAX / w; w = MAX; } } else { if (h > MAX) { w *= MAX / h; h = MAX; } }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    const base64 = canvas.toDataURL('image/jpeg', 0.6);
                    await addDoc(collection(db, "messages"), { 
                        senderId: me.id, 
                        name: me.name, 
                        receiverId: currentTab === 'public' ? 'public' : currentPrivateUserId,
                        text: '[عکس]', 
                        image: base64,
                        time: Date.now() 
                    });
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
            document.getElementById('chat-file').value = '';
        }

        // ایموجی
        window.toggleEmoji = function() {
            document.getElementById('emoji-picker').classList.toggle('hidden');
        }
        window.addEmoji = function(emoji) {
            const input = document.getElementById('msg');
            input.value += emoji;
            input.focus();
            document.getElementById('emoji-picker').classList.add('hidden');
        }

        // تغییر پروفایل
        window.uploadAvatar = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = async function() {
                    const canvas = document.createElement('canvas');
                    const MAX = 150; let w = img.width, h = img.height;
                    if (w > h) { if (w > MAX) { h *= MAX / w; w = MAX; } } else { if (h > MAX) { w *= MAX / h; h = MAX; } }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    const base64 = canvas.toDataURL('image/jpeg', 0.7);
                    await updateDoc(doc(db, "users", me.id), { avatar: base64 });
                    alert('عکس پروفایل تغییر کرد!');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        window.saveProfile = async function() {
            const newName = document.getElementById('prof-name').value;
            const newBio = document.getElementById('prof-bio').value;
            await updateDoc(doc(db, "users", me.id), { name: newName, bio: newBio });
            alert('پروفایل ذخیره شد!');
            me.name = newName; me.bio = newBio;
            document.getElementById('welcome').innerText = me.name;
        }

        // پنل مدیریت
        window.openAdmin = function() {
            if (prompt('رمز مدیریت:') !== '357753') return;
            switchTab('admin');
        }

        function renderAdmin() {
            let html = '';
            usersList.forEach(u => {
                html += `<div class="admin-row"><div>${u.name} (@${u.username}) ${u.isVerified?'✔️':''} ${u.isBlocked?'🚫':''}</div>
                <div>
                    <button onclick="toggleVerify('${u.id}', ${u.isVerified})" style="background:#3b82f6;">تیک</button>
                    <button onclick="toggleBlock('${u.id}', ${u.isBlocked})" style="background:#f59e0b;">بلاک</button>
                </div></div>`;
            });
            document.getElementById(
