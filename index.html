<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چت پرو</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, Arial, sans-serif; }
        body { background-color: #000000; color: #ffffff; height: 100vh; overflow: hidden; }
        
        .hidden { display: none !important; }
        
        .glass { background: #0a0a0a; border: 1px solid #222; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .input-field {
            width: 100%; background-color: #111; border: 1px solid #333; color: #fff;
            padding: 14px; border-radius: 12px; margin-bottom: 12px; outline: none; font-size: 14px; transition: border-color 0.2s;
        }
        .input-field:focus { border-color: #4f46e5; }
        
        .btn {
            width: 100%; background-color: #4f46e5; color: white; border: none;
            padding: 14px; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; transition: background 0.2s;
        }
        .btn:hover { background-color: #4338ca; }
        
        #auth-screen { display: flex; align-items: center; justify-content: center; height: 100vh; padding: 20px; }
        .auth-box { width: 100%; max-width: 400px; padding: 30px; }
        .auth-title { font-size: 28px; font-weight: bold; text-align: center; color: #818cf8; margin-bottom: 20px; }
        .link-text { color: #818cf8; cursor: pointer; font-size: 14px; text-align: center; display: block; margin-top: 15px; }
        
        #main-screen { display: flex; height: 100vh; }
        
        .sidebar { width: 260px; background: #0a0a0a; border-left: 1px solid #222; display: flex; flex-direction: column; }
        .user-info { padding: 20px; border-bottom: 1px solid #222; display: flex; align-items: center; gap: 12px; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; background: #4f46e5; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; overflow: hidden; flex-shrink: 0; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .nav-menu { flex: 1; padding: 10px; }
        .nav-btn { width: 100%; text-align: right; background: transparent; border: none; color: #ccc; padding: 12px 15px; border-radius: 10px; cursor: pointer; font-size: 15px; margin-bottom: 5px; }
        .nav-btn:hover { background: #1a1a1a; color: #fff; }
        .nav-btn.active { background: #1a1a1a; color: #818cf8; font-weight: bold; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; }
        .content-area { flex: 1; overflow-y: auto; padding: 20px; }
        
        .chat-container { display: flex; flex-direction: column; height: 100%; }
        .chat-box { flex: 1; overflow-y: auto; padding-bottom: 80px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 16px; margin-bottom: 10px; font-size: 14px; display: flex; flex-direction: column; }
        .message.mine { background: #4f46e5; margin-right: auto; border-bottom-right-radius: 4px; }
        .message.other { background: #1f1f1f; margin-left: auto; border-bottom-left-radius: 4px; }
        .message-sender { font-size: 11px; color: #aaa; margin-bottom: 4px; display: flex; align-items: center; gap: 5px; }
        .message-sender img { width: 16px; height: 16px; border-radius: 50%; }
        .message img.chat-img { max-width: 100%; border-radius: 8px; margin-top: 5px; }
        
        .chat-input-area { position: absolute; bottom: 0; left: 0; right: 0; padding: 10px 15px; background: #000; border-top: 1px solid #222; display: flex; gap: 8px; align-items: center; }
        .chat-input { flex: 1; background: #111; border: 1px solid #333; color: white; padding: 12px; border-radius: 12px; outline: none; }
        .icon-btn { background: transparent; border: none; color: #aaa; font-size: 24px; cursor: pointer; padding: 0 5px; display: flex; align-items: center; justify-content: center; }
        .icon-btn:hover { color: white; }
        
        .emoji-picker { position: absolute; bottom: 70px; left: 15px; background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 10px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; width: 250px; max-height: 200px; overflow-y: auto; z-index: 100; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .emoji-picker span { font-size: 24px; cursor: pointer; text-align: center; }
        .emoji-picker span:hover { background: #333; border-radius: 5px; }
        
        .mobile-nav { display: none; }
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .mobile-nav { display: flex; justify-content: space-around; padding: 15px; background: #0a0a0a; border-top: 1px solid #222; position: absolute; bottom: 0; width: 100%; z-index: 10; }
            .mobile-nav button { background: none; border: none; color: white; font-size: 20px; }
            .content-area { padding: 15px; padding-bottom: 80px; }
            .chat-input-area { bottom: 60px; padding: 8px 10px; }
            .emoji-picker { bottom: 120px; left: 10px; }
        }
        .loading { text-align: center; color: #888; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="glass auth-box">
            <h1 class="auth-title">چت پرو</h1>
            <div id="auth-error" class="hidden" style="color: #ef4444; text-align: center; margin-bottom: 10px; font-size: 14px;"></div>

            <div id="register-form">
                <input type="text" id="reg-name" placeholder="نام" class="input-field">
                <input type="text" id="reg-username" placeholder="نام کاربری" class="input-field">
                <input type="password" id="reg-password" placeholder="رمز عبور" class="input-field">
                <input type="text" id="reg-phone" placeholder="شماره تلفن" class="input-field">
                <input type="text" id="reg-code" placeholder="کد دمو (12345)" class="input-field">
                <button onclick="register()" class="btn" id="reg-btn">ثبت‌نام</button>
                <span class="link-text" onclick="toggleAuth('login')">حساب داری؟ وارد شو</span>
            </div>

            <div id="login-form" class="hidden">
                <input type="text" id="log-username" placeholder="نام کاربری" class="input-field">
                <input type="password" id="log-password" placeholder="رمز عبور" class="input-field">
                <button onclick="login()" class="btn" id="log-btn">ورود</button>
                <span class="link-text" onclick="toggleAuth('register')">حساب نداری؟ ثبت‌نام کن</span>
            </div>
            
            <div id="auth-loading" class="loading hidden">در حال بررسی اطلاعات...</div>
        </div>
    </div>

    <div id="main-screen" class="hidden">
        <div class="sidebar">
            <div class="user-info">
                <div class="avatar" id="user-avatar"></div>
                <div>
                    <div style="font-weight: bold; display: flex; align-items: center; gap: 5px;" id="user-name-display"></div>
                    <div style="font-size: 12px; color: #888;" id="user-username-display"></div>
                </div>
            </div>
            <div class="nav-menu">
                <button onclick="switchTab('public')" id="btn-public" class="nav-btn active">🌐 چت عمومی</button>
                <button onclick="switchTab('private')" id="btn-private" class="nav-btn">💬 چت خصوصی</button>
                <button onclick="switchTab('profile')" id="btn-profile" class="nav-btn">👤 پروفایل</button>
                <button onclick="openAdmin()" class="nav-btn" style="color: #fbbf24;">🛡️ پنل مدیریت</button>
            </div>
            <div style="padding: 15px; border-top: 1px solid #222;">
                <button onclick="logout()" class="nav-btn" style="color: #ef4444;">🚪 خروج</button>
            </div>
        </div>

        <div class="main-content">
            <div id="content-area" class="content-area"></div>
            <div class="mobile-nav">
                <button onclick="switchTab('public')">🌐</button>
                <button onclick="switchTab('private')">💬</button>
                <button onclick="switchTab('profile')">👤</button>
                <button onclick="openAdmin()">🛡️</button>
                <button onclick="logout()" style="color: #ef4444;">🚪</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, updateDoc, deleteDoc, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCpksdl0L0z81tNJBMj_PjOQMS-kcn_Ceg",
            authDomain: "chat-pro-ff65d.firebaseapp.com",
            projectId: "chat-pro-ff65d",
            storageBucket: "chat-pro-ff65d.firebasestorage.app",
            messagingSenderId: "804620446100",
            appId: "1:804620446100:web:776a714048fb732b93c781"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentUser = JSON.parse(localStorage.getItem('cp_currentUser')) || null;
        let allUsers = [];
        let allMessages = [];
        let currentChatId = 'public';
        let currentPrivateUserId = null;
        let unsubscribeMessages = null;
        let unsubscribeUsers = null;

        function listenToUsers(callback) {
            if (unsubscribeUsers) unsubscribeUsers();
            unsubscribeUsers = onSnapshot(collection(db, "users"), (snapshot) => {
                allUsers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                if (callback) callback();
            });
        }

        function listenToMessages(callback) {
            if (unsubscribeMessages) unsubscribeMessages();
            const q = query(collection(db, "messages"), orderBy("createdAt", "asc"));
            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                allMessages = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                if (callback) callback();
            });
        }

        window.toggleAuth = function(type) {
            document.getElementById('register-form').classList.toggle('hidden', type === 'login');
            document.getElementById('login-form').classList.toggle('hidden', type === 'register');
            document.getElementById('auth-error').classList.add('hidden');
        }

        function showError(msg) {
            const el = document.getElementById('auth-error');
            el.innerText = msg;
            el.classList.remove('hidden');
        }

        window.register = async function() {
            const name = document.getElementById('reg-name').value;
            const username = document.getElementById('reg-username').value.toLowerCase();
            const password = document.getElementById('reg-password').value;
            const phone = document.getElementById('reg-phone').value;
            const code = document.getElementById('reg-code').value;

            if (code !== '12345') return showError('کد دمو اشتباه است (کد: 12345)');
            if (!name || !username || !password) return showError('همه فیلدها الزامی است');

            document.getElementById('auth-loading').classList.remove('hidden');
            document.getElementById('reg-btn').classList.add('hidden');

            try {
                const q = query(collection(db, "users"), where("username", "==", username));
                const querySnapshot = await getDocs(q);
                
                if (!querySnapshot.empty) {
                    document.getElementById('auth-loading').classList.add('hidden');
                    document.getElementById('reg-btn').classList.remove('hidden');
                    return showError('نام کاربری تکراری است');
                }

                const newUser = { name, username, password, phone, isVerified: false, isBlocked: false, bio: '', avatar: '' };
                const docRef = await addDoc(collection(db, "users"), newUser);
                
                newUser.id = docRef.id;
                currentUser = newUser;
                localStorage.setItem('cp_currentUser', JSON.stringify(currentUser));
                showMain();
            } catch (e) {
                showError('خطا در اتصال به دیتابیس');
                document.getElementById('auth-loading').classList.add('hidden');
                document.getElementById('reg-btn').classList.remove('hidden');
            }
        }

        window.login = async function() {
            const username = document.getElementById('log-username').value.toLowerCase();
            const password = document.getElementById('log-password').value;

            if (!username || !password) return showError('نام کاربری و رمز را وارد کنید');

            document.getElementById('auth-loading').classList.remove('hidden');
            document.getElementById('log-btn').classList.add('hidden');

            try {
                const q = query(collection(db, "users"), where("username", "==", username), where("password", "==", password));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    document.getElementById('auth-loading').classList.add('hidden');
                    document.getElementById('log-btn').classList.remove('hidden');
                    return showError('نام کاربری یا رمز اشتباه است');
                }

                const userDoc = querySnapshot.docs[0];
                const user = { id: userDoc.id, ...userDoc.data() };

                if (user.isBlocked) {
                    document.getElementById('auth-loading').classList.add('hidden');
                    document.getElementById('log-btn').classList.remove('hidden');
                    return showError('حساب شما مسدود شده است');
                }

                currentUser = user;
                localStorage.setItem('cp_currentUser', JSON.stringify(currentUser));
                showMain();
            } catch (e) {
                showError('خطا در اتصال به دیتابیس');
                document.getElementById('auth-loading').classList.add('hidden');
                document.getElementById('log-btn').classList.remove('hidden');
            }
        }

        window.logout = function() {
            currentUser = null;
            localStorage.removeItem('cp_currentUser');
            document.getElementById('main-screen').classList.add('hidden');
            document.getElementById('auth-screen').style.display = 'flex';
            document.getElementById('reg-name').value = '';
            document.getElementById('reg-username').value = '';
            document.getElementById('reg-password').value = '';
            document.getElementById('log-username').value = '';
            document.getElementById('log-password').value = '';
        }

        function showMain() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-screen').classList.remove('hidden');
            
            listenToUsers(() => {
                const myUpdatedData = allUsers.find(u => u.id === currentUser.id);
                if (myUpdatedData) {
                    currentUser = myUpdatedData;
                    localStorage.setItem('cp_currentUser', JSON.stringify(currentUser));
                    
                    let avatarHtml = currentUser.avatar ? `<img src="${currentUser.avatar}">` : currentUser.name.charAt(0);
                    document.getElementById('user-avatar').innerHTML = avatarHtml;
                    
                    let displayName = currentUser.name;
                    if (currentUser.isVerified) displayName += ' <span style="color: #3b82f6; font-size: 14px;">✔️</span>';
                    document.getElementById('user-name-display').innerHTML = displayName;
                    document.getElementById('user-username-display').innerText = '@' + currentUser.username;
                    
                    if(currentChatId === 'private') renderPrivateList(document.getElementById('content-area'));
                    if(currentChatId === 'profile') renderProfile(document.getElementById('content-area'));
                }
            });

            switchTab('public');
        }

        window.switchTab = function(tab) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if(document.getElementById('btn-'+tab)) document.getElementById('btn-'+tab).classList.add('active');
            
            const area = document.getElementById('content-area');
            if (tab === 'public') {
                currentChatId = 'public';
                currentPrivateUserId = null;
                renderChat(area, 'چت عمومی');
            } else if (tab === 'private') {
                currentChatId = 'private';
                currentPrivateUserId = null;
                renderPrivateList(area);
            } else if (tab === 'profile') {
                currentChatId = 'profile';
                renderProfile(area);
            }
        }

        function renderChat(area, title, otherUserId = null) {
            let header = `<h2 style="font-size: 18px; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #222; padding-bottom: 10px;">${title}</h2>`;
            let chatBox = `<div id="chat-box" class="chat-box"></div>`;
            
            let inputArea = `
                <div class="chat-input-area">
                    <label class="icon-btn" for="chat-img-upload">📎</label>
                    <input type="file" id="chat-img-upload" accept="image/*" style="display: none;" onchange="uploadChatImage(event, '${otherUserId || 'public'}')">
                    
                    <button class="icon-btn" onclick="toggleEmojiPicker()">😀</button>
                    
                    <input type="text" id="msg-input" class="chat-input" placeholder="پیامت را بنویس..." onkeypress="if(event.key==='Enter') sendMsg('${otherUserId || 'public'}')">
                    <button onclick="sendMsg('${otherUserId || 'public'}')" class="btn" style="width: auto; padding: 10px 20px;">ارسال</button>
                    
                    <div id="emoji-picker" class="emoji-picker hidden">
                        <span onclick="addEmoji('😀')">😀</span><span onclick="addEmoji('😂')">😂</span><span onclick="addEmoji('😍')">😍</span>
                        <span onclick="addEmoji('🥰')">🥰</span><span onclick="addEmoji('😎')">😎</span><span onclick="addEmoji('🤔')">🤔</span>
                        <span onclick="addEmoji('😢')">😢</span><span onclick="addEmoji('😡')">😡</span><span onclick="addEmoji('👍')">👍</span>
                        <span onclick="addEmoji('❤️')">❤️</span><span onclick="addEmoji('🔥')">🔥</span><span onclick="addEmoji('🎉')">🎉</span>
                        <span onclick="addEmoji('🙏')">🙏</span><span onclick="addEmoji('💯')">💯</span><span onclick="addEmoji('👋')">👋</span>
                        <span onclick="addEmoji('🙌')">🙌</span><span onclick="addEmoji('✨')">✨</span><span onclick="addEmoji('⭐')">⭐</span>
                        <span onclick="addEmoji('😴')">😴</span><span onclick="addEmoji('🤗')">🤗</span><span onclick="addEmoji('😅')">😅</span>
                        <span onclick="addEmoji('🥳')">🥳</span><span onclick="addEmoji('💔')">💔</span><span onclick="addEmoji('💪')">💪</span>
                    </div>
                </div>
            `;
            area.innerHTML = `<div class="chat-container">${header}${chatBox}${inputArea}</div>`;
