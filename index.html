<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چت پرو - دمو</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Vazirmatn, sans-serif; background-color: #0f172a; color: white; }
        .hidden { display: none !important; }
        .chat-box { height: calc(100vh - 160px); overflow-y: auto; }
    </style>
</head>
<body class="p-4 pb-20">

    <!-- صفحه ورود با اسم -->
    <div id="login-screen" class="fixed inset-0 bg-slate-900 flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 p-8 rounded-3xl w-full max-w-sm shadow-2xl text-center">
            <h1 class="text-3xl font-bold text-blue-500 mb-2">چت پرو 💬</h1>
            <p class="text-gray-400 text-sm mb-6">نسخه دمو (بدون نیاز به پیامک)</p>
            <input type="text" id="name-input" placeholder="اسمت رو بنویس..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-center mb-4 text-lg outline-none focus:border-blue-500">
            <button onclick="login()" class="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded-xl font-bold transition-all">ورود به چت</button>
        </div>
    </div>

    <!-- صفحه چت -->
    <div id="chat-screen" class="hidden max-w-lg mx-auto">
        <header class="bg-slate-800 p-4 rounded-2xl flex justify-between items-center shadow-md mb-4">
            <h1 class="font-bold text-lg">چت عمومی 🌍</h1>
            <button onclick="logout()" class="text-red-400 text-sm hover:text-red-300">خروج</button>
        </header>

        <div id="chat-box" class="chat-box bg-slate-800/50 rounded-2xl p-4 flex flex-col gap-3 mb-4"></div>
        
        <div class="flex gap-2 fixed bottom-4 left-4 right-4 max-w-lg mx-auto bg-slate-800 p-2 rounded-2xl border border-slate-700">
            <input type="text" id="msg-input" placeholder="پیام خود را بنویسید..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl p-3 outline-none focus:border-blue-500 text-sm" onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-700 px-6 rounded-xl font-bold transition-all text-sm">ارسال</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://tdmhcqiwwzkzgdzvikiu.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_Oo570G6D0UYC2Sny9xZGjA_qSEo-bhi';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = localStorage.getItem('chat_demo_name');

        function login() {
            const name = document.getElementById('name-input').value.trim();
            if(!name) return alert('اسمت رو وارد کن!');
            localStorage.setItem('chat_demo_name', name);
            currentUser = name;
            showChat();
        }

        function logout() {
            localStorage.removeItem('chat_demo_name');
            location.reload();
        }

        function showChat() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            loadMessages();
            // هر 3 ثانیه پیام‌های جدید رو چک کن
            setInterval(loadMessages, 3000);
        }

        async function loadMessages() {
            const box = document.getElementById('chat-box');
            const { data: messages } = await supabaseClient.from('messages').select('*').order('created_at', { ascending: true });
            
            if(!messages) return;
            
            box.innerHTML = '';
            messages.forEach(msg => {
                const isMe = msg.user_name === currentUser;
                box.innerHTML += `
                    <div class="flex ${isMe ? 'justify-end' : 'justify-start'}">
                        <div class="max-w-[80%] p-3 rounded-2xl ${isMe ? 'bg-blue-600 rounded-br-none' : 'bg-slate-700 rounded-bl-none'}">
                            ${!isMe ? `<div class="text-xs text-blue-300 mb-1">${msg.user_name}</div>` : ''}
                            <div class="text-sm whitespace-pre-wrap">${msg.content}</div>
                        </div>
                    </div>
                `;
            });
            box.scrollTop = box.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('msg-input');
            const content = input.value.trim();
            if (!content) return;
            
            input.value = ''; 
            await supabaseClient.from('messages').insert({
                user_name: currentUser,
                content: content
            });
            loadMessages();
        }

        // اگر قبلا لاگین کرده بود
        if (currentUser) {
            showChat();
        }
    </script>
</body>
</html>
