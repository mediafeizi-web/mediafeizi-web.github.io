<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چت پرو</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --primary: #6366f1;
            --primary-gradient: linear-gradient(135deg, #6366f1, #a855f7);
            --bg-dark: #09090b;
            --bg-panel: #18181b;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
        }
        * { box-sizing: border-box; font-family: Vazirmatn, Tahoma; }
        body { background-color: var(--bg-dark); color: var(--text-main); margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .hidden { display: none !important; }
        
        /* کادرهای شیشه‌ای */
        .glass { background: rgba(24, 24, 27, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
        
        .box { background: var(--bg-panel); padding: 20px; border-radius: 20px; margin: 20px auto; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 400px; width: 90%; }
        
        input, button { width: 100%; padding: 14px; margin: 8px 0; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.03); color: var(--text-main); font-size: 14px; transition: 0.3s; outline: none; }
        input:focus { border-color: var(--primary); background: rgba(255,255,255,0.05); box-shadow: 0 0 10px rgba(99,102,241,0.2); }
        
        button { background: var(--primary-gradient); border: none; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(99,102,241,0.4); }
        button:active { transform: scale(0.97); }
        
        /* هدر */
        #main-header { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .avatar-ring { border: 2px solid var(--primary); padding: 2px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px rgba(99,102,241,0.5); }
        .avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; }
        .admin-btn { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid #ef4444; width: auto; padding: 6px 12px; font-size: 12px; box-shadow: none; margin: 0; }
        
        /* محتوا */
        #content-area { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 90px; scroll-behavior: smooth; }
        #content-area::-webkit-scrollbar { width: 4px; }
        #content-area::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        
        /* پیام‌ها */
        .msg { margin-bottom: 15px; display: flex; gap: 10px; max-width: 85%; animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .msg.mine { background: var(--primary-gradient); margin-right: auto; border-radius: 16px 16px 0 16px; padding: 10px 15px; box-shadow: 0 4px 15px rgba(99,102,241,0.3); }
        .msg.other { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.05); margin-left: auto; border-radius: 16px 16px 16px 0; padding: 10px 15px; }
        
        .msg-header { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-size: 12px; color: rgba(255,255,255,0.8); }
        .msg img.chat-img { max-width: 100%; border-radius: 10px; margin-top: 8px; border: 1px solid rgba(255,255,255,0.1); }
        
        /* لیست کاربران */
        .user-item { display: flex; align-items: center; gap: 12px; padding: 12px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; }
        .user-item:hover { background: rgba(255,255,255,0.05); }
        
        /* نوار پایین */
        #bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-around; padding: 10px 0; z-index: 100; }
        #bottom-nav button { width: 60px; height: 60px; background: transparent; box-shadow: none; font-size: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); padding: 0; margin: 0; transition: 0.3s; }
        #bottom-nav button.active { color: var(--primary); text-shadow: 0 0 10px var(--primary); }
        
        /* کادر ارسال پیام */
        #chat-input { position: fixed; bottom: 70px; left: 10px; right: 10px; display: flex; gap: 8px; padding: 8px; border-radius: 30px; z-index: 90; }
        #chat-input input { margin: 0; flex: 1; border-radius: 20px; padding: 12px 15px; background: transparent; border: none; box-shadow: none; }
        #chat-input button { width: auto; margin: 0; padding: 10px 15px; border-radius: 20px; }
        
        /* ایموجی */
        #emoji-picker { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; padding: 15px; border-radius: 20px; position: fixed; bottom: 140px; left: 10px; right: 10px; z-index: 100; background: rgba(24, 24, 27, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        #emoji-picker span { font-size: 26px; cursor: pointer; text-align: center; transition: 0.2s; }
        #emoji-picker span:hover { transform: scale(1.2); }
        
        .admin-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(255,255,255,0.02); border-radius: 10px; margin-bottom: 5px;}
        .admin-row button { width: auto; padding: 6px 12px; font-size: 12px; margin: 0 2px; }
    </style>
</head>
<body>

    <!-- صفحه ورود -->
    <div id="auth-screen" class="box" style="margin-top: 80px;">
        <h1 style="text-align:center; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 32px; margin-bottom: 20px;">چت پرو</h1>
        <input type="text" id="name" placeholder="نام شما">
        <input type="text" id="user" placeholder="نام کاربری (انگلیسی)">
        <input type="password" id="pass" placeholder="رمز عبور">
        <input type="text" id="code" placeholder="کد دمو (12345)">
        <button onclick="login()" style="margin-top: 15px;">ورود / ثبت‌نام</button>
    </div>

    <!-- هدر اصلی -->
    <div id="main-header" class="glass hidden">
        <div style="display:flex; align-items:center; gap:12px;">
            <div class="avatar-ring"><img id="my-avatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="avatar"></div>
            <span id="welcome" style="font-weight:bold; font-size: 15px;"></span>
        </div>
        <button class="admin-btn" onclick="switchTab('admin')">مدیریت</button>
    </div>

    <!-- محتوای اصلی -->
    <div id="content-area" class="hidden">
        <!-- چت عمومی -->
        <div id="tab-public" class="tab-content">
            <div id="public-msgs"></div>
        </div>
        
        <!-- چت خصوصی -->
        <div id="tab-private" class="tab-content hidden">
            <div id="private-list"></div>
            <div id="private-chat" class="hidden">
                <button onclick="backToPrivateList()" style="background:rgba(255,255,255,0.1); margin-bottom:15px; width:auto;">🔙 بازگشت</button>
                <div id="private-msgs"></div>
            </div>
        </div>

        <!-- پروفایل -->
        <div id="tab-profile" class="tab-content hidden">
            <div class="box">
                <h3 style="text-align:center; margin-bottom:15px;">پروفایل من</h3>
                <div class="avatar-ring" style="width:90px; height:90px; margin:auto; margin-bottom:15px;">
                    <img id="prof-avatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">
                </div>
                <input type="file" id="avatar-file" accept="image/*" style="display:none;" onchange="uploadAvatar(event)">
                <button onclick="document.getElementById('avatar-file').click()" style="background:rgba(255,255,255,0.05); margin-bottom:15px;">تغییر عکس پروفایل</button>
                
                <label style="font-size:12px; color:var(--text-muted); margin-right:5px;">نام</label>
                <input type="text" id="prof-name">
                
                <label style="font-size:12px; color:var(--text-muted); margin-right:5px;">بیوگرافی</label>
                <input type="text" id="prof-bio">
                
                <button onclick="saveProfile()" style="margin-top:15px;">ذخیره تغییرات</button>
            </div>
        </div>

        <!-- پنل مدیریت -->
        <div id="tab-admin" class="tab-content hidden">
            <div id="admin-list"></div>
        </div>
    </div>

    <!-- نوار پایین -->
    <div id="bottom-nav" class="glass hidden">
        <button id="nav-public" onclick="switchTab('public')">🌐<span style="font-size:10px; margin-top:3px;">عمومی</span></button>
        <button id="nav-private" onclick="switchTab('private')">💬<span style="font-size:10px; margin-top:3px;">خصوصی</span></button>
        <button id="nav-profile" onclick="switchTab('profile')">👤<span style="font-size:10px; margin-top:3px;">پروفایل</span></button>
    </div>

    <!-- نوار ارسال پیام -->
    <div id="chat-input" class="glass hidden">
        <label for="chat-file" style="cursor:pointer; font-size:24px; padding:5px; color:var(--text-muted);">📎</label>
        <input type="file" id="chat-file" accept="image/*" style="display:none;" onchange="uploadChatImage(event)">
        <button onclick="toggleEmoji()" style="background:none; border:none; box-shadow:none; color:var(--text-muted); font-size:24px; padding:5px;">😀</button>
        <input type="text" id="msg" placeholder="پیام..." onkeypress="if(event.key==='Enter') sendMsg()">
        <button onclick="sendMsg()" style="padding:12px 20px;">ارسال</button>
    </div>
    
    <div id="emoji-picker" class="hidden">
        <span onclick="addEmoji('😀')">😀</span><span onclick="addEmoji('😂')">😂</span><span onclick="addEmoji('😍')">😍</span><span onclick="addEmoji('😎')">😎</span><span onclick="addEmoji('🤔')">🤔</span><span onclick="addEmoji('👍')">👍</span><span onclick="addEmoji('❤️')">❤️</span><span onclick="addEmoji('🔥')">🔥</span><span onclick="addEmoji('🎉')">🎉</span><span onclick="addEmoji('🙏')">🙏</span><span onclick="addEmoji('💯')">💯</span><span onclick="addEmoji('👋')">👋</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, updateDoc, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCpksdl0L0z81tNJBMj_PjOQMS-kcn_Ceg",
            authDomain: "chat-pro-ff65d.firebaseapp.com",
            projectId: "chat-pro-ff65d",
            storageBucket: "chat-pro-ff65d.firebasestorage.app",
            messagingSenderId: "804620446100",
            appId: "1:804620446100:web:776a714048fb732b93c781"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let me = null;
        let usersList = [];
        let allMsgs = [];
        let currentTab = 'public';
        let currentPrivateUserId = null;

        // ورود
        window.login = async function() {
            const name = document.getElementById('name').value.trim();
            const user = document.getElementById('user').value.trim().toLowerCase();
            const pass = document.getElementById('pass').value;
            const code = document.getElementById('code').value;

            if (code !== '12345') return alert('کد دمو اشتباه است!');
            if (!name || !user || !pass) return alert('همه فیلدها الزامی است!');

            const q = query(collection(db, "users"), where("username", "==", user));
            const snap = await getDocs(q);

            if (!snap.empty) {
                let u = snap.docs[0].data();
                u.id = snap.docs[0].id;
                if (u.password !== pass) return alert('رمز عبور اشتباه است!');
                if (u.isBlocked) return alert('حساب شما مسدود شده است!');
                me = u;
            } else {
                const newUser = { name, username: user, password: pass, isVerified: false, isBlocked: false, avatar: '', bio: '' };
                const docRef = await addDoc(collection(db, "users"), newUser);
                newUser.id = docRef.id;
                me = newUser;
            }
            localStorage.setItem('cp_user', JSON.stringify(me));
            startChat();
        }

        window.logout = function() {
            localStorage.removeItem('cp_user');
            location.reload();
        }

        function startChat() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('main-header').classList.remove('hidden');
            document.getElementById('content-area').classList.remove('hidden');
            document.getElementById('bottom-nav').classList.remove('hidden');
            
            document.getElementById('welcome').innerText = me.name;
            if(me.avatar) document.getElementById('my-avatar').src = me.avatar;

            // لیسینر کاربران
            onSnapshot(collection(db, "users"), (snap) => {
                usersList = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                const myData = usersList.find(u => u.id === me.id);
                if (myData) {
                    if (myData.isBlocked) { alert('شما مسدود شدید!'); logout(); return; }
                    me = myData;
                    document.getElementById('welcome').innerText = me.name + (me.isVerified ? ' ✔️' : '');
                    if(me.avatar) { document.getElementById('my-avatar').src = me.avatar; document.getElementById('prof-avatar').src = me.avatar; }
                    if(currentTab === 'private') renderPrivateList();
                    if(currentTab === 'admin') renderAdmin();
                }
            });

            // لیسینر پیام‌ها
            onSnapshot(query(collection(db, "messages"), orderBy("time", "asc")), (snap) => {
                allMsgs = snap.docs.map(d => d.data());
                if (currentTab === 'public') renderPublic();
                if (currentTab === 'private' && currentPrivateUserId) renderPrivateMsgs();
            });

            switchTab('public');
        }

        window.switchTab = function(tab) {
            currentTab = tab;
            currentPrivateUserId = null;
            
            // آپدیت منوی پایین
            document.querySelectorAll('#bottom-nav button').forEach(b => b.classList.remove('active'));
            if(document.getElementById('nav-'+tab)) document.getElementById('nav-'+tab).classList.add('active');

            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('chat-input').classList.add('hidden');
            document.getElementById('emoji-picker').classList.add('hidden');

            if (tab === 'public') {
                document.getElementById('tab-public').classList.remove('hidden');
                document.getElementById('chat-input').classList.remove('hidden');
                renderPublic();
            } else if (tab === 'private') {
                document.getElementById('tab-private').classList.remove('hidden');
                document.getElementById('private-chat').classList.add('hidden');
                document.getElementById('private-list').classList.remove('hidden');
                renderPrivateList();
            } else if (tab === 'profile') {
                document.getElementById('tab-profile').classList.remove('hidden');
                document.getElementById('prof-name').value = me.name;
                document.getElementById('prof-bio').value = me.bio || '';
            } else if (tab === 'admin') {
                document.getElementById('tab-admin').classList.remove('hidden');
                renderAdmin();
            }
        }

        function renderPublic() {
            let html = '';
            allMsgs.filter(m => m.receiverId === 'public').forEach(m => {
                let sender = usersList.find(u => u.id === m.senderId) || { name: m.name, avatar: '' };
                let av = sender.avatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
                let tick = sender.isVerified ? ' ✔️' : '';
                let img = m.image ? `<img src="${m.image}" class="chat-img">` : '';
                let isMine = m.senderId === me.id;
                
                html += `<div class="msg ${isMine ? 'mine' : 'other'}">
                    <div style="width:100%;">
                        <div class="msg-header">
                            ${!isMine ? `<img src="${av}" class="avatar" style="width:24px;height:24px;">` : ''}
                            <b>${m.name}${tick}</b>
                        </div>
                        <div>${m.text}${img}</div>
                    </div>
                </div>`;
            });
            document.getElementById('public-msgs').innerHTML = html;
            document.getElementById('content-area').scrollTop = document.getElementById('content-area').scrollHeight;
        }

        function renderPrivateList() {
            let html = '';
            usersList.filter(u => u.id !== me.id && !u.isBlocked).forEach(u => {
                let av = u.avatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
                let tick = u.isVerified ? ' ✔️' : '';
                html += `<div class="user-item" onclick="openPrivateChat('${u.id}')">
                    <div class="avatar-ring"><img src="${av}" class="avatar"></div>
                    <div><b style="font-size:15px;">${u.name}${tick}</b><br><small style="color:var(--text-muted);">@${u.username}</small></div>
                </div>`;
            });
            document.getElementById('private-list').innerHTML = html;
        }

        window.openPrivateChat = function(id) {
            currentPrivateUserId = id;
            document.getElementById('private-list').classList.add('hidden');
            document.getElementById('private-chat').classList.remove('hidden');
            document.getElementById('chat-input').classList.remove('hidden');
            renderPrivateMsgs();
        }

        window.backToPrivateList = function() {
            currentPrivateUserId = null;
            document.getElementById('private-chat').classList.add('hidden');
            document.getElementById('private-list').classList.remove('hidden');
            document.getElementById('chat-input').classList.add('hidden');
        }

        function renderPrivateMsgs() {
            let html = '';
            allMsgs.filter(m => (m.senderId === me.id && m.receiverId === currentPrivateUserId) || (m.senderId === currentPrivateUserId && m.receiverId === me.id)).forEach(m => {
                let sender = usersList.find(u => u.id === m.senderId) || { name: m.name, avatar: '' };
                let av = sender.avatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
                let tick = sender.isVerified ? ' ✔️' : '';
                let img = m.image ? `<img src="${m.image}" class="chat-img">` : '';
                let isMine = m.senderId === me.id;
                
                html += `<div class="msg ${isMine ? 'mine' : 'other'}">
                    <div style="width:100%;">
                        <div clas
