<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Calculator</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #e0f7fa, #f5f5f5);
      font-family: Arial, sans-serif;
    }

    .calculator {
      width: 320px;
      background: #1f1f1f;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }

    .display {
      width: 100%;
      height: 80px;
      background: #2d2d2d;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 2.1rem;
      text-align: right;
      padding: 15px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 12px;
      height: 60px;
      font-size: 1.3rem;
      cursor: pointer;
      transition: transform 0.08s ease, opacity 0.2s ease;
    }

    button:hover {
      opacity: 0.95;
    }

    button:active {
      transform: scale(0.98);
    }

    .operator {
      background: #ffb703;
      color: #111;
      font-weight: bold;
    }

    .number {
      background: #f0f0f0;
      color: #111;
    }

    .action {
      background: #d0d0d0;
      color: #111;
    }

    .zero {
      grid-column: span 2;
    }

    .equal {
      background: #34c759;
      color: white;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <input class="display" type="text" value="0" readonly />

    <div class="buttons">
      <button class="action" data-action="clear">C</button>
      <button class="action" data-action="delete">DEL</button>
      <button class="operator" data-value="/">÷</button>
      <button class="operator" data-value="*">×</button>

      <button class="number" data-value="7">7</button>
      <button class="number" data-value="8">8</button>
      <button class="number" data-value="9">9</button>
      <button class="operator" data-value="-">−</button>

      <button class="number" data-value="4">4</button>
      <button class="number" data-value="5">5</button>
      <button class="number" data-value="6">6</button>
      <button class="operator" data-value="+">+</button>

      <button class="number" data-value="1">1</button>
      <button class="number" data-value="2">2</button>
      <button class="number" data-value="3">3</button>
      <button class="equal" data-action="equals">=</button>

      <button class="number zero" data-value="0">0</button>
      <button class="number" data-value=".">.</button>
    </div>
  </div>

  <script>
    const display = document.querySelector('.display');
    const buttons = document.querySelectorAll('button');

    let currentInput = '0';
    let firstOperand = null;
    let operator = null;
    let waitingForSecondOperand = false;

    function updateDisplay() {
      display.value = currentInput;
    }

    function inputDigit(digit) {
      if (waitingForSecondOperand) {
        currentInput = digit;
        waitingForSecondOperand = false;
      } else {
        currentInput = currentInput === '0' ? digit : currentInput + digit;
      }
      updateDisplay();
    }

    function inputDecimal() {
      if (waitingForSecondOperand) {
        currentInput = '0.';
        waitingForSecondOperand = false;
      } else if (!currentInput.includes('.')) {
        currentInput += '.';
      }
      updateDisplay();
    }

    function clearCalculator() {
      currentInput = '0';
      firstOperand = null;
      operator = null;
      waitingForSecondOperand = false;
      updateDisplay();
    }

    function deleteLast() {
      if (waitingForSecondOperand) return;
      currentInput = currentInput.length > 1
        ? currentInput.slice(0, -1)
        : '0';
      updateDisplay();
    }

    function performCalculation() {
      const secondOperand = Number(currentInput);

      if (firstOperand === null || operator === null) {
        return;
      }

      let result;

      switch (operator) {
        case '+':
          result = firstOperand + secondOperand;
          break;
        case '-':
          result = firstOperand - secondOperand;
          break;
        case '*':
          result = firstOperand * secondOperand;
          break;
        case '/':
          result = secondOperand === 0 ? 'Error' : firstOperand / secondOperand;
          break;
        default:
          return;
      }

      currentInput = String(result);
      firstOperand = null;
      operator = null;
      waitingForSecondOperand = false;
      updateDisplay();
    }

    function setOperator(nextOperator) {
      const inputValue = Number(currentInput);

      if (firstOperand === null) {
        firstOperand = inputValue;
      } else if (operator) {
        const previousValue = firstOperand;
        const currentValue = inputValue;

        switch (operator) {
          case '+':
            firstOperand = previousValue + currentValue;
            break;
          case '-':
            firstOperand = previousValue - currentValue;
            break;
          case '*':
            firstOperand = previousValue * currentValue;
            break;
          case '/':
            firstOperand = currentValue === 0 ? 'Error' : previousValue / currentValue;
            break;
        }

        if (firstOperand === 'Error') {
          currentInput = 'Error';
          firstOperand = null;
          operator = null;
          waitingForSecondOperand = false;
          updateDisplay();
          return;
        }
      }

      operator = nextOperator;
      waitingForSecondOperand = true;
      currentInput = String(firstOperand);
      updateDisplay();
    }

    // این قسمت جا افتاده بود که کاملش کردم
    buttons.forEach(button => {
      button.addEventListener('click', () => {
        const value = button.dataset.value;
        const action = button.dataset.action;

        if (value) {
          if (value === '.') {
            inputDecimal();
          } else if (['+', '-', '*', '/'].includes(value)) {
            setOperator(value);
          } else {
            inputDigit(value);
          }
        } else if (action) {
          if (action === 'clear') {
            clearCalculator();
          } else if (action === 'delete') {
            deleteLast();
          } else if (action === 'equals') {
            performCalculation();
          }
        }
      });
    });
  </script>
</body>
  </html>
