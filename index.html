<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تست</title>
</head>
<body style="background:#000; color:white; text-align:center; padding-top:50px;">
    <h1 style="color:red;" id="status">در حال لود شدن...</h1>
    <button onclick="alert('دکمه کار می‌کند!')" style="padding:20px; font-size:20px;">تست دکمه</button>
    <script>
        window.onerror = function(msg) {
            document.getElementById('status').innerText = "خطا در لود کدها: " + msg;
            document.getElementById('status').style.color = "red";
        };
        document.getElementById('status').innerText = "کدها با موفقیت لود شدند!";
        document.getElementById('status').style.color = "green";
    </script>
</body>
</html>
