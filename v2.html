<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>چت پرو</title><style>*{box-sizing:border-box;font-family:Tahoma}body{background:linear-gradient(135deg,#0f172a,#1e1b4b,#000);color:#fff;margin:0;height:100vh;display:flex;flex-direction:column}.h{display:none!important}#auth,#admin{padding:20px;margin-top:50px;text-align:center;background:rgba(255,255,255,.05);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);border-radius:20px;width:90%;max-width:400px;align-self:center}input,button{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.5);color:#fff;font-family:Tahoma}button{background:linear-gradient(135deg,#6366f1,#a855f7);border:none;font-weight:bold;cursor:pointer}#main{flex:1;display:flex;flex-direction:column}#head{display:flex;justify-content:space-between;align-items:center;padding:15px;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.1)}#chat{flex:1;overflow-y:auto;padding:15px}.msg{padding:12px;margin:8px 0;border-radius:15px 15px 15px 0;background:rgba(255,255,255,.08);backdrop-filter:blur(5px);max-width:85%;width:fit-content;border:1px solid rgba(255,255,255,.05)}.msg.mine{background:linear-gradient(135deg,#6366f1,#a855f7);border-radius:15px 15px 0 15px;margin-left:auto;border:none}.msg img{max-width:100%;border-radius:10px;margin-top:5px}.av{width:35px;height:35px;border-radius:50%;object-fit:cover;border:2px solid #6366f1}#inp{display:flex;gap:8px;padding:10px;background:rgba(0,0,0,.6);backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.1)}#inp input{margin:0;flex:1;border-radius:20px;padding:10px 15px;background:rgba(255,255,255,.1)}#inp button,#inp label{width:auto;padding:10px 15px;font-size:20px;margin:0;border-radius:20px}#emo{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;padding:10px;background:rgba(0,0,0,.8);backdrop-filter:blur(10px);position:absolute;bottom:70px;left:10px;right:10px;border-radius:15px;border:1px solid rgba(255,255,255,.1)}#emo span{font-size:24px;cursor:pointer;text-align:center}.row{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid rgba(255,255,255,.1)}.row button{width:auto;padding:5px 10px;font-size:12px;margin:0 2px;border-radius:5px}</style></head><body>
<div id="auth"><h2>ثبت نام چت پرو</h2><input id="n" placeholder="نام و نام خانوادگی"><input id="u" placeholder="نام کاربری"><input id="p" type="password" placeholder="رمز عبور"><input id="c" placeholder="کد دمو (12345)"><button onclick="reg()">ثبت نام / ورود</button></div>
<div id="main" class="h"><div id="head"><div style="display:flex;align-items:center;gap:10px"><label for="fav"><img id="myav" class="av" src="https://cdn-icons-png.flaticon.com/512/149/149071.png"></label><input type="file" id="fav" class="h" onchange="upAv(event)"><b id="wn"></b></div><button onclick="adm()" style="width:auto;padding:5px 10px;background:#ef4444;border-radius:8px">مدیریت</button></div><div id="chat"></div><div id="emo" class="h"><span onclick="addE('😀')">😀</span><span onclick="addE('😂')">😂</span><span onclick="addE('😍')">😍</span><span onclick="addE('😎')">😎</span><span onclick="addE('👍')">👍</span><span onclick="addE('❤️')">❤️</span><span onclick="addE('🔥')">🔥</span><span onclick="addE('🙏')">🙏</span><span onclick="addE('💯')">💯</span><span onclick="addE('👋')">👋</span><span onclick="addE('🎉')">🎉</span><span onclick="addE('💪')">💪</span></div><div id="inp"><label for="fimg">📎</label><input type="file" id="fimg" class="h" onchange="upImg(event)"><button onclick="togE()" style="background:none;box-shadow:none">😀</button><input id="m" placeholder="پیام..." onkeypress="if(event.key==='Enter')send()"><button onclick="send()">ارسال</button></div></div>
<div id="admin" class="h"><h3 style="color:#ef4444">پنل مدیریت</h3><div id="alist"></div><button onclick="cTab('main')" style="margin-top:10px">بازگشت</button></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";import{getFirestore,collection,addDoc,onSnapshot,query,orderBy,doc,updateDoc,where,getDocs}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const db=getFirestore(initializeApp({apiKey:"AIzaSyCpksdl0L0z81tNJBMj_PjOQMS-kcn_Ceg",authDomain:"chat-pro-ff65d.firebaseapp.com",projectId:"chat-pro-ff65d",storageBucket:"chat-pro-ff65d.firebasestorage.app",messagingSenderId:"804620446100",appId:"1:804620446100:web:776a714048fb732b93c781"}));
const $=id=>document.getElementById(id);let me=JSON.parse(localStorage.getItem('u'))||null,us=[],ms=[];
window.reg=async()=>{if($('c').value!=='12345')return alert('کد دمو 12345');let u=$('u').value.trim().toLowerCase(),p=$('p').value,n=$('n').value.trim();if(!u||!p||!n)return alert('کامل پر کن');let q=await getDocs(query(collection(db,"users"),where("un","==",u)));if(!q.empty){let x=q.docs[0].data();x.id=q.docs[0].id;if(x.p!==p)return alert('رمز غلط');if(x.blk)return alert('بلاک هستی');me=x}else{let nu={n:n,un:u,p:p,ver:false,blk:false,av:''};let r=await addDoc(collection(db,"users"),nu);nu.id=r.id;me=nu}localStorage.setItem('u',JSON.stringify(me));go()};
function go(){$('auth').classList.add('h');$('main').classList.remove('h');onSnapshot(collection(db,"users"),s=>{us=s.docs.map(d=>({id:d.id,...d.data()}));let m=us.find(u=>u.id===me.id);if(m){if(m.blk){alert('بلاک شدی');localStorage.removeItem('u');location.reload()}me=m;$('wn').innerText=me.n+(me.ver?' ✔️':'');if(me.av)$('myav').src=me.av;if(!$('admin').classList.contains('h'))rAdm()}});onSnapshot(query(collection(db,"messages"),orderBy("t","asc")),s=>{ms=s.docs.map(d=>d.data());rChat()})}
function rChat(){let h='';ms.forEach(m=>{let s=us.find(u=>u.id===m.sid)||{n:m.n,av:'',ver:false};let av=s.av||'https://cdn-icons-png.flaticon.com/512/149/149071.png';let v=s.ver?' ✔️':'';let img=m.img?`<img src="${m.img}">`:'';h+=`<div class="msg ${m.sid===me.id?'mine':''}"><div style="display:flex;gap:5px"><img src="${av}" class="av"><b>${m.n}${v}:</b></div><div>${m.txt}${img}</div></div>`});$('chat').innerHTML=h;$('chat').scrollTop=99999}
window.send=async()=>{if(!$('m').value.trim())return;let t=$('m').value;$('m').value='';await addDoc(collection(db,"messages"),{sid:me.id,n:me.n,txt:t,t:Date.now()})};
window.togE=()=>$('emo').classList.toggle('h');window.addE=e=>{$('m').value+=e;$('m').focus();$('emo').classList.add('h')};
window.upAv=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{let i=new Image();i.onload=async()=>{let c=document.createElement('canvas'),M=100,w=i.width,h=i.height;if(w>h){if(w>M){h*=M/w;w=M}}else{if(h>M){w*=M/h;h=M}}c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);await updateDoc(doc(db,"users",me.id),{av:c.toDataURL('image/jpeg',0.7)});alert('عکس آپلود شد')};i.src=ev.target.result};r.readAsDataURL(f)};
window.upImg=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{let i=new Image();i.onload=async()=>{let c=document.createElement('canvas'),M=400,w=i.width,h=i.height;if(w>h){if(w>M){h*=M/w;w=M}}else{if(h>M){w*=M/h;h=M}}c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);await addDoc(collection(db,"messages"),{sid:me.id,n:me.n,txt:'[عکس]',img:c.toDataURL('image/jpeg',0.6),t:Date.now()})};i.src=ev.target.result};r.readAsDataURL(f);$('fimg').value=''};
window.adm=()=>{if(prompt('رمز:')!=='357753')return;$('main').classList.add('h');$('admin').classList.remove('h');rAdm()};
window.cTab=t=>{$('admin').classList.add('h');$(t).classList.remove('h')};
function rAdm(){let h='';us.forEach(u=>{h+=`<div class="row"><div>${u.n} (@${u.un}) ${u.ver?'✔️':''} ${u.blk?'🚫':''}</div><div><button onclick="tV('${u.id}',${u.ver})" style="width:auto;padding:5px;background:#3b82f6">تیک</button><button onclick="tB('${u.id}',${u.blk})" style="width:auto;padding:5px;background:#f59e0b">بلاک</button></div></div>`});$('alist').innerHTML=h}
window.tV=async(i,s)=>await updateDoc(doc(db,"users",i),{ver:!s});window.tB=async(i,s)=>await updateDoc(doc(db,"users",i),{blk:!s});
if(me)go();
</script></body></html>
